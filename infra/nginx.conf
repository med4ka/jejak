events {
    worker_connections 1024;
}

http {
    # LEARN:
    #   Kenapa: Mengdefinisikan upstream group dengan round-robin (default nginx algorithm).
    #   Konsep design yang terkait: Horizontal scaling - menambah instance API lebih banyak
    #   tanpa perlu merubah aplikasi, hanya konfigurasi LB aja. Round-robin distributes
    #   request secara merata ke setiap instance.
    #   Trade-off: Round-robin sederhana dan performa baik untuk request yang sama-sama
    #   berat, tapi tidak mengikuti beban aktual (least connection) sehingga instance tertentu
    #   bisa overloaded sementara yang lain senggang.
    #   Alternatif: Least connections atau IP hash, tapi lebih kompleks config.
    upstream api_backend {
        # Multiple API instances with round-robin (default)
        server api1:8080;
        server api2:8080;
    }

    server {
        # Hanya :80. Listener :443 + ssl_certificate dihapus karena tidak ada
        # file cert di repo; nginx gagal start kalau sertifikat tidak ada.
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }
    }
}
